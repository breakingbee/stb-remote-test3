name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Verify iOS workspace
        run: |
          echo "iOS contents:"
          find ios -maxdepth 2 -type f | sort

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -type d -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found"
            exit 1
          fi

          if [ ! -f "$WORKSPACE/contents.xcworkspacedata" ]; then
            echo "ERROR: Workspace exists but contents.xcworkspacedata is missing:"
            echo "$WORKSPACE"
            exit 1
          fi

          echo "Workspace:"
          echo "$WORKSPACE"

      - name: Build unsigned archive
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -type d -print -quit)

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "STBRemote" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/STBRemote.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/STBRemote.xcarchive/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -r "StbRemote-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StbRemote-unsigned-ipa
          path: ${{ runner.temp }}/StbRemote-unsigned.ipa
          retention-days: 14
